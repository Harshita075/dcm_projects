name: Snowflake DCM - Test

on:
  workflow_run:
    # BUG 1 FIXED: Separate quotes for each workflow
    workflows: ["Snowflake DCM - Plan", "Snowflake DCM - Deploy"]
    types:
      - completed
    # BUG 2 FIXED: Removed the branches filter so feature branches can trigger this

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SF_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SF_PASSWORD }}

jobs:
  test:
    name: Execute Post-Deploy Tests
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
        
      - name: Install Snowflake CLI
        run: pip install snowflake-cli-labs

      - name: Determine Target
        # BUG 3 FIXED: Smart routing for both Plan (PR base branch) and Deploy (Push head branch)
        run: |
          WORKFLOW_NAME="${{ github.event.workflow_run.name }}"
          
          if [[ "$WORKFLOW_NAME" == *"Plan"* ]]; then
            BRANCH="${{ github.event.workflow_run.pull_requests[0].base.ref }}"
            if [[ -z "$BRANCH" ]]; then
               echo "Could not find PR base branch, defaulting to dev"
               BRANCH="dev"
            fi
          else
            BRANCH="${{ github.event.workflow_run.head_branch }}"
          fi
          
          echo "Evaluated Target Branch: $BRANCH"
          
          if [[ "$BRANCH" == "dev" ]]; then echo "TARGET=DCM_DEV" >> $GITHUB_ENV; fi
          if [[ "$BRANCH" == "uat" ]]; then echo "TARGET=DCM_UAT" >> $GITHUB_ENV; fi
          if [[ "$BRANCH" == "main" ]]; then echo "TARGET=DCM_PROD" >> $GITHUB_ENV; fi

      - name: Run DCM Test
        run: |
          echo "Executing snow dcm test against $TARGET..."
          snow dcm test --target $TARGET --temporary-connection

      - name: Send Email on Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com 
          server_port: 465                
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ❌ Snowflake DCM Pipeline Failed
          body: A failure occurred during the testing phase of the Snowflake DCM pipeline. Please review the GitHub Actions logs.
          to: your-team@domain.com       
          from: GitHub Actions