name: Snowflake DCM - Test

on:
  workflow_run:
    workflows: ["Snowflake DCM - Deploy"]
    types:
      - completed
    branches: [dev, uat, main]

env:
  SNOWFLAKE_CONNECTIONS_DEFAULT_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
  SNOWFLAKE_CONNECTIONS_DEFAULT_USER: ${{ secrets.SF_USER }}
  SNOWFLAKE_CONNECTIONS_DEFAULT_PASSWORD: ${{ secrets.SF_PASSWORD }}

jobs:
  test:
    name: Execute Post-Deploy Tests
    # Only run this job if the Deploy workflow was actually successful
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: pip install snowflake-cli-labs

      - name: Determine Environment Suffix
        run: |
          # Use the branch that triggered the Deploy workflow
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          if [[ "$BRANCH" == "dev" ]]; then echo "ENV_SUFFIX=_DEV" >> $GITHUB_ENV; fi
          if [[ "$BRANCH" == "uat" ]]; then echo "ENV_SUFFIX=_UAT" >> $GITHUB_ENV; fi
          if [[ "$BRANCH" == "main" ]]; then echo "ENV_SUFFIX=" >> $GITHUB_ENV; fi

      - name: Trigger Metric Evaluation
        run: |
          echo "Testing dynamic table on ${ENV_SUFFIX} environment..."
          snow sql -q "ALTER DYNAMIC TABLE SALES${ENV_SUFFIX}_DB.ANALYTICS.DAILY_SALES_SUMMARY REFRESH;" --temporary-connection

          # ==========================================
      # ADD THE NOTIFICATION STEP HERE (At the very end)
      # ==========================================
      - name: Send Email on Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com # Replace with your SMTP server address
          server_port: 465               # Common port for SSL
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ❌ Snowflake DCM Pipeline Failed
          body: A failure occurred in the Snowflake DCM pipeline. Please review the GitHub Actions logs.
          to: your-team@domain.com       # The email address receiving the alert
          from: GitHub Actions