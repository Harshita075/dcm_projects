name: Snowflake DCM - Test

on:
  workflow_run:
    workflows: ["Snowflake DCM - Deploy"]
    types:
      - completed
    branches: [dev, uat, main]

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SF_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SF_PASSWORD }}

jobs:
  test:
    name: Execute Post-Deploy Tests
    # Only run this job if the Deploy workflow was actually successful
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
        
      - name: Install Snowflake CLI
        run: pip install snowflake-cli-labs

      - name: Determine Target
        run: |
          # Use the branch that triggered the Deploy workflow
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          if [[ "$BRANCH" == "dev" ]]; then echo "TARGET=DCM_DEV" >> $GITHUB_ENV; fi
          if [[ "$BRANCH" == "uat" ]]; then echo "TARGET=DCM_UAT" >> $GITHUB_ENV; fi
          if [[ "$BRANCH" == "main" ]]; then echo "TARGET=DCM_PROD" >> $GITHUB_ENV; fi

      - name: Run DCM Test
        run: |
          echo "Executing snow dcm test against $TARGET..."
          snow dcm test --target $TARGET --temporary-connection

      - name: Send Email on Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com 
          server_port: 465                
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ❌ Snowflake DCM Pipeline Failed
          body: A failure occurred during the testing phase of the Snowflake DCM pipeline. Please review the GitHub Actions logs.
          to: your-team@domain.com       
          from: GitHub Actions