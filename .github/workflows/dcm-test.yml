name: Snowflake DCM - Test

on:
  workflow_run:
    workflows: ["Snowflake DCM - Deploy"]
    types:
      - completed
    branches: [dev, uat, main]

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SF_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SF_PASSWORD }}

jobs:
  test:
    name: Execute Post-Deploy Tests
    # Only run this job if the Deploy workflow was actually successful
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
        
      - name: Install Snowflake CLI
        run: pip install snowflake-cli-labs

      - name: Determine Environment Suffix
        run: |
          # Use the branch that triggered the Deploy workflow
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          if [[ "$BRANCH" == "dev" ]]; then echo "ENV_SUFFIX=_DEV" >> $GITHUB_ENV; fi
          if [[ "$BRANCH" == "uat" ]]; then echo "ENV_SUFFIX=_UAT" >> $GITHUB_ENV; fi
          if [[ "$BRANCH" == "main" ]]; then echo "ENV_SUFFIX=" >> $GITHUB_ENV; fi

      - name: Execute All DMF Tests
        run: |
          echo "Running all Data Metric Function tests on ${ENV_SUFFIX} environment..."
          
          # Enable nullglob so the loop doesn't fail if the tests directory is empty
          shopt -s nullglob
          
          # Loop through every SQL file in the tests directory
          for test_file in tests/*.sql; do
            echo "------------------------------------------------"
            echo "Executing Test: $test_file"
            
            # Execute the SQL file. 
            # We pass the ENV_SUFFIX as a variable so your SQL can dynamically target the right database.
            snow sql -f "$test_file" --variable "env_suffix=${ENV_SUFFIX}" --temporary-connection
            
            # Capture the exit code of the snow sql command
            if [ $? -ne 0 ]; then
              echo "❌ Test failed: $test_file"
              exit 1
            fi
          done
          echo "✅ All tests completed successfully."

      - name: Send Email on Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com 
          server_port: 465                
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ❌ Snowflake DCM Pipeline Failed
          body: A failure occurred during the testing phase of the Snowflake DCM pipeline. Please review the GitHub Actions logs.
          to: your-team@domain.com       
          from: GitHub Actions