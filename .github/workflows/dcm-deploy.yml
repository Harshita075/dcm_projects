name: Snowflake DCM - Deploy

on:
  push:
    branches: [dev, uat, main]

env:
  SNOWFLAKE_CONNECTIONS_DEFAULT_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
  SNOWFLAKE_CONNECTIONS_DEFAULT_USER: ${{ secrets.SF_USER }}
  SNOWFLAKE_CONNECTIONS_DEFAULT_PASSWORD: ${{ secrets.SF_PASSWORD }}

jobs:
  deploy:
    name: Execute Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: pip install snowflake-cli-labs
      
      - name: Determine Target
        run: |
          if [[ "${{ github.ref_name }}" == "dev" ]]; then echo "TARGET=DCM_DEV" >> $GITHUB_ENV; fi
          if [[ "${{ github.ref_name }}" == "uat" ]]; then echo "TARGET=DCM_UAT" >> $GITHUB_ENV; fi
          if [[ "${{ github.ref_name }}" == "main" ]]; then echo "TARGET=DCM_PROD" >> $GITHUB_ENV; fi
          
      - name: Run DCM Deploy
        run: snow dcm deploy --target $TARGET --temporary-connection